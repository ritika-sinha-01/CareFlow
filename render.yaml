# Optional CareFlow worker on Render Starter.
# The HTTP API runs on Vercel Functions (backend/vercel.json), not here.
# Use this service only if you want the 2-second persistent job loop.
# Do not put secrets in this file.

services:
  - type: worker
    name: careflow-worker
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w backend
    startCommand: npm run start:worker
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: ENABLE_DEMO_SIMULATION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
